# Dependabot config for dunamis-studios-web.
#
# Scope: keeps the npm dependency tree and GitHub Actions workflows
# patched on a low-churn cadence. The Vercel deploy is the canonical
# delivery path; CI workflows here are limited but the action SHAs
# still want monthly attention. PR volume is capped to keep
# review-load manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      next-ecosystem:
        patterns:
          - next
          - "@next/*"
          - eslint-config-next
      stripe-ecosystem:
        patterns:
          - "@stripe/*"
          - stripe
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      types:
        patterns:
          - "@types/*"
      dev-tooling:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
