# Dependabot config for dunamis-studios-web.
#
# Scope: keeps the npm dependency tree and GitHub Actions workflows
# patched on a low-churn cadence. The Vercel deploy is the canonical
# delivery path; CI workflows here are limited but the action SHAs
# still want monthly attention. PR volume is capped to keep
# review-load manageable.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: "main"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    labels:
      - dependencies
      - npm
    groups:
      next-ecosystem:
        patterns:
          - next
          - "@next/*"
          - eslint-config-next
      stripe-ecosystem:
        patterns:
          - "@stripe/*"
          - stripe
      radix-ui:
        patterns:
          - "@radix-ui/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      types:
        patterns:
          - "@types/*"
      dev-tooling:
        dependency-type: development
    ignore:
      # eslint-config-next 16.x bundles eslint-plugin-import,
      # eslint-plugin-jsx-a11y, and eslint-plugin-react sub-deps whose peer
      # ranges still cap at eslint@^9. npm tolerates the conflict on install
      # with warnings but the lint pipeline runs on the v9-pinned binary.
      # Revisit when eslint-config-next's bundled plugins declare eslint@^10
      # in their peerDependencies; remove this block + bump eslint then.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: "main"
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: scope
    labels:
      - dependencies
      - github-actions
